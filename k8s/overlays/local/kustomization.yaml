# unogroup-app/k8s/overlays/local/kustomization.yaml
# Para uso contra un clúster local (kind/minikube) con el resto del stack
# de ensambles corriendo en el mismo namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml
  # Credenciales reales de Solution One para tu entorno local — no se
  # commitea (ver .gitignore). Copiar secret-patch.yaml.example y editar
  # antes del primer `kubectl apply -k` / scripts/deploy-local.ps1.
  - path: secret-patch.yaml

images:
  - name: unogroup-app
    # Tag por defecto para `kubectl apply -k` manual. Para desarrollo
    # iterativo usar scripts/deploy-local.ps1, que construye con un tag
    # único por build y lo aplica vía `kubectl set image` — evita servir
    # una imagen vieja cuando el nodo ya tiene el tag `local` cacheado
    # (imagePullPolicy: IfNotPresent no detecta que el contenido cambió).
    newTag: local
