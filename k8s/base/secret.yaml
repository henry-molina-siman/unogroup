# unogroup-app/k8s/base/secret.yaml
#
# PLACEHOLDER — no reales. Nunca commitear usuario/password reales aquí.
#
# Cada ambiente debe reemplazar estos valores antes de aplicar, por ejemplo:
#   kubectl create secret generic unogroup-app-solutionone-secret \
#     --namespace ensambles \
#     --from-literal=SOLUTIONONE_USUARIO=... \
#     --from-literal=SOLUTIONONE_PASSWORD=... \
#     --dry-run=client -o yaml | kubectl apply -f -
# o gestionarlo con sealed-secrets / SOPS / un ExternalSecret respaldado por
# GCP Secret Manager (el unogroup-app-sa ya tiene el IAM necesario vía
# Workload Identity, ver base/serviceaccount.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: unogroup-app-solutionone-secret
type: Opaque
stringData:
  SOLUTIONONE_USUARIO: "CHANGE_ME"
  SOLUTIONONE_PASSWORD: "CHANGE_ME"
